# Локальная база для разработки: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: val
      POSTGRES_PASSWORD: val_dev_password
      POSTGRES_DB: val
    ports: ['5432:5432']
    volumes: ['val_pgdata:/var/lib/postgresql/data']
volumes:
  val_pgdata:
